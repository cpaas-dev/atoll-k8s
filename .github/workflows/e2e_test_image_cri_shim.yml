name: E2E Test atoll image-cri-shim service

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/e2e_test_image_cri_shim.yml"
      - "cmd/**"
      - "internal/imagecrishim/**"
      - "test/**"
  pull_request:
    branches: ["*"]
    paths:
      - ".github/workflows/e2e_test_image_cri_shim.yml"
      - "cmd/**"
      - "internal/imagecrishim/**"
      - "test/**"

# Avoid using ${{ github.workflow }} - when called via workflow_call, it inherits the caller's name causing conflicts
concurrency:
  group: e2e-test-image-cri-shim-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call_ci_workflow:
    uses: ./.github/workflows/import-patch-image.yml
    with:
      arch: amd64
      e2e: true
      image: false
  verify-image_cri_shim:
    needs: [call_ci_workflow]
    runs-on: ubuntu-24.04
    steps:
      - name: Install Dependencies
        run: sudo apt update && sudo apt install -y libgpgme-dev libbtrfs-dev libdevmapper-dev
      - name: Download image-cri-shim
        uses: actions/download-artifact@v4
        with:
          name: image-cri-shim-amd64
          path: /tmp/
      - name: Download atoll
        uses: actions/download-artifact@v4
        with:
          name: atoll-amd64
          path: /tmp/
      - name: Verify atoll
        run: |
          sudo chmod a+x /tmp/{atoll,image-cri-shim}
          sudo mv /tmp/atoll /usr/bin/
          sudo atoll version
      - name: Download e2e test
        uses: actions/download-artifact@v4
        with:
          name: e2e.test
          path: /tmp/
      - name: Remove containerd && docker
        run: |
          sudo apt-get remove -y moby-buildx moby-cli moby-compose moby-containerd moby-engine
          sudo systemctl unmask containerd || true
          sudo systemctl unmask docker || true
          sudo mkdir -p /sys/fs/cgroup/systemd
          sudo mount -t cgroup -o none,name=systemd cgroup /sys/fs/cgroup/systemd || true

      - name: Run image-cri-shim test
        shell: bash
        working-directory: /tmp/
        run: |
          sudo apt-get remove docker docker-engine docker.io containerd runc
          sudo apt-get purge docker-ce docker-ce-cli containerd.io # docker-compose-plugin
          sudo apt-get remove -y moby-engine moby-cli moby-buildx moby-compose
          sudo rm -rf /var/run/docker.sock
          sudo rm -rf /run/containerd/containerd.sock
          sudo chmod a+x /tmp/e2e.test
          sudo /tmp/e2e.test --ginkgo.v --ginkgo.focus="E2E_image-cri-shim_run_test"
