<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 128" width="356" height="128" role="img" aria-label="CPaaS">
  <title>CPaaS</title>
  <style>
    .wordmark {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -1px;
      fill: #1F2328;
    }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #E6EDF3; }
    }
  </style>
  <!-- Kubernetes hexagon -->
  <polygon points="64,8 112.5,36 112.5,92 64,120 15.5,92 15.5,36"
           fill="none" stroke="#326CE5" stroke-width="8" stroke-linejoin="round"/>
  <!-- Container cube: top / left / right faces -->
  <polygon points="64,40 88,52 64,64 40,52" fill="#5B8DEF"/>
  <polygon points="40,52 64,64 64,88 40,76" fill="#326CE5"/>
  <polygon points="88,52 64,64 64,88 88,76" fill="#1F4FB8"/>
  <text class="wordmark" x="146" y="64" dominant-baseline="central">CPaaS</text>
</svg>
